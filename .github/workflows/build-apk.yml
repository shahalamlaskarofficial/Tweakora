name: Build Tweakora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Optimized Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: cp app/build/outputs/apk/release/app-release.apk Tweakora.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Tweakora v1.1 Build #${{ github.run_number }}
          body: "Optimized Release APK — smooth 120fps Liquid Glass UI & organized Glass Boxes."
          files: Tweakora.apk
          make_latest: true
