name: Build Tweakora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk Tweakora.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tweakora Build #${{ github.run_number }}
          body: "Automated Tweakora APK build — download Tweakora.apk below and install directly."
          files: Tweakora.apk
          make_latest: true
